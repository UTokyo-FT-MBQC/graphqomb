[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphqomb"
version = "0.5.3"
description = "A modular Graph State qompiler for measurement-based quantum computing."
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = {text = "MIT"}
authors = [
    {name = "Masato Fukushima", email = "masa1063fuk@gmail.com"},
    {name = "Sora Shiratani"},
    {name = "Yuki Watanabe"},
    {name = "Daichi Sasaki"},
]
maintainers = [
    {name = "Masato Fukushima", email = "masa1063fuk@gmail.com"},
]
keywords = [
    "quantum computing",
    "MBQC",
    "measurement-based quantum computing",
    "quantum compilation",
    "fault-tolerant quantum computing",
    "graph state",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "matplotlib",
    "networkx",
    "numpy>=1.22,<3",
    "ortools>=9,<10",
    "scipy>=1.15.3",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "scipy-stubs>=1.15.3.0",
    "ty==0.0.69",
    "types-networkx==3.6.1.20260728",
]
doc = [
    "furo>=2025.12.19",
    "matplotlib>=3.7.0",
    "sphinx>=8.1.3",
    "sphinx-gallery>=0.17.0",
]
pyzx = [
    "pyzx>=0.10",
]
stim = [
    "stim>=1.15",
]

[project.urls]
Homepage = "https://github.com/UTokyo-FT-MBQC/graphqomb"
Documentation = "https://graphqomb.readthedocs.io/"
Repository = "https://github.com/UTokyo-FT-MBQC/graphqomb"
Changelog = "https://github.com/UTokyo-FT-MBQC/graphqomb/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/UTokyo-FT-MBQC/graphqomb/issues"

[tool.setuptools.package-data]
graphqomb = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  # Conflicts with ruff format
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "single-line-implicit-string-concatenation",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "tab-indentation",

  # Not necessary for this project
  "AIR",
  "ASYNC",
  "DJ",
  "PD",

  # Manually disabled
  "CPY",     # copyright missing
  "undocumented-magic-method",    # undocumented magic method
  "ERA",     # commented-out code
  "FBT",     # boolean-trap
  "FIX",     # fixme
  "too-many-public-methods", # too-many-public-methods
]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
  "__array__",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "assert",    # `assert` detected
  "private-member-access",  # private method
  "import-private-name", # private method
  "magic-value-comparison", # magic value in test
  "no-self-use", # method could be static
  "undocumented-public-module",
  "undocumented-public-function",
  "undocumented-public-package",
  "missing-trailing-period",
  "undocumented-param",    # return not documented (numpy style)
  "docstring-missing-returns",  # return not documented (pydoclint)
]
"examples/*.py" = [
  "print", # print
  "D",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning"
markers = [
  "slow: mark test as slow",
  "pyzx: tests requiring the optional PyZX dependency",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  'raise NotImplementedError\(.*\)',
  "return NotImplemented",
  'typing_extensions.assert_never\(.*\)',
  "@abc.abstractmethod",
]
fail_under = 50

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["graphqomb", "tests", "examples"]

[tool.ty.src]
include = ["graphqomb", "tests", "examples"]

[tool.ty.analysis]
strict-literal-narrowing = true

# ty enables nearly every rule by default, so this section only promotes the
# handful that ship disabled or as warnings. See
# https://docs.astral.sh/ty/reference/rules/ for the full list.
[tool.ty.rules]
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "error"

[tool.pyright]
include = ["graphqomb", "tests", "examples"]
reportUnusedFunction = "error"
reportUnusedClass = "error"
reportUnknownArgumentType = "information"
reportUnknownLambdaType = "information"
reportUnknownMemberType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType = "information"
