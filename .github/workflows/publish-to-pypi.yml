name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow on tag pushes starting with 'v'

permissions:
  contents: write  # Required for creating GitHub releases

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphqomb
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write  # Required for creating GitHub releases

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          uv-version: "0.11.16"
          enable-cache: true

      - name: Build package
        run: uv run --with build==1.5.0 python -m build --installer uv

      - name: Check package
        run: uv run --with twine==6.2.0 twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        env:
          # Passed through the environment rather than interpolated into the script: a tag name is
          # not a safe shell token.
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Extract the section for this version from CHANGELOG.md
          CONTENT=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/d;/^## \[/q;p}" CHANGELOG.md)
          # Random delimiter so changelog text cannot close the heredoc and forge step outputs.
          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "content<<$DELIMITER"
            echo "$CONTENT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
